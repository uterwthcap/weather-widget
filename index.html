<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./js/main.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="wrapper">
        <div class="left-side">
            <form class="search top-side-search">
                <input class="form-search" type="text" placeholder="Search Location...">

                <button class="search-button" type="submit">
                    <img src="pic/search.png" class="search-img" alt="Search">
                </button>
            </form>
            

            <div class="main-data-container">
                <h1 class="current-temp">16°</h1>
                <div class="city-and-date">
                    <h3 class="city">London</h3>
                    <p class="date">06:09 - Monday, 9 Sep ‘23</p>
                </div>
                <img class="img-main-data" src="./pic/cloudy.svg" alt="">
            </div>
        </div>

        <div class="right-side">
            
            <div class="right-side-container">
                <form class="search right-side-search">
                    <input class="form-search" type="text" placeholder="Search Location...">

                    <button class="search-button" type="submit">
                        <img src="pic/search.png" class="search-img" alt="Search">
                    </button>
                </form>
                
                <p class="weather-details">Weather Details</p>

                <div class="common-info">
                    <p class="weather-status">thunderstorm with light drizzle</p>

                    <div class="temp-max-container common-info-container">
                        <p class="temp-max parameter-text">Temp max</p>
                        <div class="parameter-value">
                            <p class="today-temp-max weather-parameter-info">19°</p>
                            <img src="pic/temp-max.png" alt="temp-max"  class="today-temp-max pic-parameter">
                        </div>
                    </div>
                    
                    <div class="temp-min-container common-info-container">
                        <p class="temp-min parameter-text">Temp min</p>
                        <div class="parameter-value">
                            <p class="today-temp-min weather-parameter-info">15°</p>
                            <img src="pic/temp-min.png" alt="temp-min"  class="today-temp-min pic-parameter">
                        </div>
                        
                    </div>
                    
                    <div class="humadity-container common-info-container">
                        <p class="humidity parameter-text">Humidity</p>
                        <div class="parameter-value">
                            <p class="today-humadity weather-parameter-info">56%</p>
                            <img src="pic/humadity.png" alt="humadity"  class="today-humadity pic-parameter">
                        </div>
                    </div>
                
                    <div class="cloudy-conainer common-info-container">
                        <p class="cloudy parameter-text">Cloudy</p>
                        <div class="parameter-value">
                            <p class="today-cloudy weather-parameter-info">86%</p>
                            <img src="pic/cloudy.png" alt="cloudy" class="today-cloudy pic-parameter">
                        </div>
                    </div>
                    
                    <div class="wind-container common-info-container">
                        <p class="wind parameter-text">Wind</p>
                        <div class="parameter-value">
                            <p class="today-wind weather-parameter-info">5 km/h</p>
                            <img src="pic/wind.png" alt="wind" class="today-wind pic-parameter">
                        </div>
                    </div>
                </div>

                
                <div class="hour-forecast">
                    <p class="today-weather-details">Today’s Weather Forecast</p>

                    <div class="weather-hours"></div>

                    <template id="hour-template">
                        <div class="weather-hour-info">
                            <div class="stats-hour-info">
                                <img src="" alt="" class="hour-pic">

                                <div class="hour-stats">
                                    <p class="time">00:00</p>
                                    <p class="weather-status-hour">Snow</p>
                                </div>
                            </div>

                            <p class="hour-temp">19°</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
